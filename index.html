<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korsika 2026 | Mentor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%; margin: 0; font-family: 'Inter', sans-serif;
            overflow-x: hidden; background-color: #0f172a; scroll-behavior: smooth;
        }
        .hero-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1549488344-1f9b8d2bd1f3?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease;
        }
        .glass-card:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-4px); }
        .section-content { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .section-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        input, textarea, select { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
    </style>
</head>
<body class="text-slate-100">
    <!-- Login Overlay -->
    <div id="loginOverlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/90 backdrop-blur-xl">
        <div class="glass p-10 w-full max-w-md text-center border-sky-500/30">
            <div class="text-6xl mb-6">🏝️</div>
            <h2 class="text-3xl font-bold mb-2">Korsika 2026</h2>
            <p class="opacity-60 mb-8 text-sm">Pro přístup zadej společné heslo</p>
            
            <input type="password" id="pwInput" placeholder="Heslo..." 
                class="w-full p-4 rounded-2xl mb-4 text-center text-2xl tracking-widest focus:ring-2 focus:ring-sky-500 outline-none transition-all">
            
            <button onclick="checkPassword()" 
                class="w-full bg-sky-600 hover:bg-sky-500 p-4 rounded-2xl font-bold text-lg transition-colors shadow-lg">
                VSTOUPIT
            </button>
            <p id="loginError" class="text-rose-400 mt-4 text-sm font-medium hidden">⚠️ Nesprávné heslo!</p>
        </div>
    </div>

    <div class="hero-bg"></div>

    <button id="homeBtn" onclick="showSection('mainDashboard')" class="fixed top-6 right-6 z-50 glass p-4 rounded-full hover:bg-white/20 transition-all hidden shadow-lg border border-white/20 group">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white group-hover:scale-110 transition-transform">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </button>

    <div class="min-h-screen flex flex-col items-center p-4 md:p-8">
        <!-- Main Dashboard -->
        <div id="mainDashboard" class="w-full max-w-5xl mt-12 md:mt-20 active section-content">
            <header class="text-center mb-12">
                <h1 class="text-6xl md:text-8xl font-bold tracking-tighter drop-shadow-2xl mb-4">Korsika <span class="text-sky-400">2026</span></h1>
                <p class="text-xl opacity-70 font-light tracking-widest uppercase">Podklady pro cestu</p>
            </header>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <button onclick="showSection('itiSubmenu')" class="glass p-8 flex flex-col items-center justify-center text-center group h-64 border-sky-500/20">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📅</div>
                    <h3 class="text-2xl font-bold text-sky-400">Vše k přepravě</h3>
                    <p class="text-sm opacity-60 mt-2">18.7. – 2.8.2026</p>
                </button>
                <button onclick="showSection('ubytovaniSubmenu')" class="glass p-8 flex flex-col items-center justify-center text-center group h-64 border-emerald-500/20">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🏠</div>
                    <h3 class="text-2xl font-bold text-emerald-400">Ubytování</h3>
                    <p class="text-sm opacity-60 mt-2">Na trase & Kempy</p>
                </button>
                <button onclick="showSection('stravovaniSubmenu')" class="glass p-8 flex flex-col items-center justify-center text-center group h-64 border-amber-500/20">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🍽️</div>
                    <h3 class="text-2xl font-bold text-amber-400">Stravování</h3>
                    <p class="text-sm opacity-60 mt-2">Jídlo & Nákupy</p>
                </button>
                <button onclick="showSection('carsSubmenu')" class="glass p-8 flex flex-col items-center justify-center text-center group h-64 border-rose-500/20">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🚗</div>
                    <h3 class="text-2xl font-bold text-rose-400">AUTA</h3>
                    <p class="text-sm opacity-60 mt-2">Posádky a povinnosti</p>
                </button>
                <button onclick="showSection('napady')" class="glass p-8 flex flex-col items-center justify-center text-center group h-64 border-white/10 lg:col-span-2">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">💡</div>
                    <h3 class="text-2xl font-bold text-white">Nápady & Poznámky</h3>
                    <p class="text-sm opacity-60 mt-2">Zapište své tipy</p>
                </button>
            </div>
        </div>

        <!-- Submenus -->
        <div id="itiSubmenu" class="w-full max-w-4xl section-content">
            <div class="text-center mb-10"><h2 class="text-4xl font-bold text-sky-400">📅 Vše k přepravě</h2><p class="opacity-60">18. 7. – 2. 8. 2026</p></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button onclick="showSection('itiRouteSubmenu')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🛣️</div>
                    <h3 class="text-3xl font-bold">Trasa</h3>
                </button>
                <button onclick="showSection('itiFerry')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🚢</div>
                    <h3 class="text-3xl font-bold">Trajekty</h3>
                </button>
            </div>
        </div>

        <div id="itiRouteSubmenu" class="w-full max-w-4xl section-content">
            <div class="text-center mb-10"><h2 class="text-4xl font-bold">🛣️ Výběr trasy</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button onclick="showSection('itiRouteTransit')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🚗</div>
                    <h3 class="text-2xl font-bold text-center">Korsika tam a zpět</h3>
                </button>
                <button onclick="showSection('itiRouteOnSite')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">⛰️</div>
                    <h3 class="text-2xl font-bold text-center">Korsika na místě</h3>
                </button>
            </div>
        </div>

        <div id="ubytovaniSubmenu" class="w-full max-w-4xl section-content">
            <div class="text-center mb-10"><h2 class="text-4xl font-bold text-emerald-400">🏠 Ubytování</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button onclick="showSection('accRoute')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🏨</div>
                    <h3 class="text-2xl font-bold">Na trase</h3>
                </button>
                <button onclick="showSection('accCampSubmenu')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">⛺</div>
                    <h3 class="text-2xl font-bold">V kempu</h3>
                </button>
            </div>
        </div>

        <div id="accCampSubmenu" class="w-full max-w-4xl section-content">
            <div class="text-center mb-10"><h2 class="text-4xl font-bold text-emerald-400">⛺ Výběr kempu</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button onclick="showSection('accCamp1')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🏖️</div>
                    <h3 class="text-2xl font-bold">Kemp 1</h3>
                </button>
                <button onclick="showSection('accCamp2')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🌲</div>
                    <h3 class="text-2xl font-bold">Kemp 2</h3>
                </button>
            </div>
        </div>

        <div id="stravovaniSubmenu" class="w-full max-w-4xl section-content">
            <div class="text-center mb-10"><h2 class="text-4xl font-bold text-amber-400">🍽️ Stravování</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button onclick="showSection('jidelnicek')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🍕</div>
                    <h3 class="text-2xl font-bold">Jídelní lístek</h3>
                </button>
                <button onclick="showSection('nakupy')" class="glass p-12 flex flex-col items-center group">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🛒</div>
                    <h3 class="text-2xl font-bold">Nákupy</h3>
                </button>
            </div>
        </div>

        <div id="carsSubmenu" class="w-full max-w-4xl section-content">
            <div class="text-center mb-10"><h2 class="text-4xl font-bold text-rose-400">🚗 Výběr auta</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <button onclick="showSection('auto1')" class="glass p-10 flex flex-col items-center group">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🏎️</div>
                    <h3 class="text-2xl font-bold">AUTO 1</h3>
                </button>
                <button onclick="showSection('auto2')" class="glass p-10 flex flex-col items-center group">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🚙</div>
                    <h3 class="text-2xl font-bold">AUTO 2</h3>
                </button>
                <button onclick="showSection('auto3')" class="glass p-10 flex flex-col items-center group">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🚐</div>
                    <h3 class="text-2xl font-bold">AUTO 3</h3>
                </button>
            </div>
        </div>

        <!-- General List View (used for Routes, Ferries, Acc, Food) -->
        <div id="generalListView" class="w-full max-w-5xl section-content">
            <div class="flex justify-between items-center mb-8">
                <div><h2 id="viewTitle" class="text-4xl font-bold">Sekce</h2><p id="viewSubtitle" class="opacity-60">Položky</p></div>
                <div class="flex gap-2">
                    <button onclick="toggleForm()" class="bg-white/20 px-6 py-3 rounded-full font-bold">+ Přidat</button>
                    <button id="backBtn" class="bg-white/10 px-6 py-3 rounded-full">Zpět</button>
                </div>
            </div>

            <!-- Form changed to <form> to fix .reset() error -->
            <form id="mainForm" class="hidden glass p-6 mb-8" onsubmit="event.preventDefault(); saveItem();">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="date" id="formDate" class="p-3 rounded-xl">
                    <input type="text" id="formPlace" placeholder="Místo / Název" class="p-3 rounded-xl">
                    <input type="text" id="formGPS" placeholder="GPS (např. 41.38, 9.15)" class="p-3 rounded-xl">
                    <input type="text" id="formWeb" placeholder="Web / Booking" class="p-3 rounded-xl">
                    <input type="text" id="formAuthor" placeholder="Tvé jméno" class="p-3 rounded-xl">
                    <textarea id="formNote" placeholder="Poznámky..." class="p-3 rounded-xl md:col-span-3 min-h-[80px]"></textarea>
                    <div class="md:col-span-3 flex gap-3">
                        <button type="submit" class="flex-1 bg-sky-500 p-3 rounded-xl font-bold">Uložit</button>
                        <button type="button" onclick="toggleForm()" class="px-6 bg-white/10 rounded-xl">Zrušit</button>
                    </div>
                </div>
            </form>
            <div id="mainList" class="grid gap-4"></div>
        </div>

        <!-- Car Detail View -->
        <div id="carDetailView" class="w-full max-w-2xl section-content">
            <div class="flex justify-between items-center mb-8">
                <h2 id="carTitle" class="text-4xl font-bold text-rose-400">AUTO 1</h2>
                <button onclick="showSection('carsSubmenu')" class="bg-white/10 px-6 py-3 rounded-full">Zpět</button>
            </div>
            
            <div class="glass p-6 mb-6">
                <h3 class="text-xl font-bold mb-4">👥 Pasažéři</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="passengerInput" placeholder="Jméno..." class="w-full rounded-xl px-4 py-3">
                    <button onclick="addPassenger()" class="bg-rose-600 px-6 rounded-xl font-bold">PŘIDAT</button>
                </div>
                <div id="passengerList" class="grid gap-2"></div>
            </div>

            <div class="glass p-6">
                <h3 class="text-xl font-bold mb-4">📋 Povinnosti</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="dutyInput" placeholder="Povinnost..." class="w-full rounded-xl px-4 py-2 text-sm">
                    <button onclick="addDuty()" class="bg-white/20 px-6 rounded-xl font-bold text-sm">PŘIDAT</button>
                </div>
                <div id="dutyList" class="grid gap-2 text-sm"></div>
            </div>
        </div>

        <!-- Nákupy -->
        <div id="nakupy" class="w-full max-w-2xl section-content">
            <div class="flex justify-between items-center mb-8"><h2 class="text-4xl font-bold text-amber-400">🛒 Nákupy</h2><button onclick="showSection('stravovaniSubmenu')" class="bg-white/10 px-4 py-2 rounded-full">Zpět</button></div>
            <div class="glass p-6">
                <div class="flex gap-2 mb-6">
                    <input type="text" id="shopInput" placeholder="Co chybí?" class="w-full rounded-xl px-4 py-3">
                    <button onclick="addShopItem()" class="bg-amber-600 px-6 rounded-xl font-bold">PŘIDAT</button>
                </div>
                <div id="shopList" class="grid gap-2"></div>
            </div>
        </div>

        <!-- Nápady -->
        <div id="napady" class="w-full max-w-2xl section-content">
            <div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-bold">💡 Nápady</h2><button onclick="showSection('mainDashboard')" class="bg-white/10 px-4 py-2 rounded-full">Zpět</button></div>
            <div id="notesList" class="grid gap-4 mb-6"></div>
            <div class="flex gap-2">
                <input type="text" id="noteInput" placeholder="Tvůj nápad..." class="w-full rounded-xl px-4 py-3">
                <button onclick="addNote()" class="bg-sky-600 px-6 rounded-xl font-bold">PŘIDAT</button>
            </div>
        </div>
    </div>

    <script>
        let currentSection = 'mainDashboard';
        // ... existing dataStore definitions ...

        window.onload = function() {
            // Check authentication
            if (localStorage.getItem('korsika_auth') === 'true') {
                document.getElementById('loginOverlay').classList.add('hidden');
            }

            // Generate Food Calendar 18.7. - 2.8.
            // ... existing food calendar logic ...
        };

        function checkPassword() {
            const input = document.getElementById('pwInput').value;
            const error = document.getElementById('loginError');
            
            if (input === '2026') {
                localStorage.setItem('korsika_auth', 'true');
                document.getElementById('loginOverlay').classList.add('hidden');
                error.classList.add('hidden');
            } else {
                error.classList.remove('hidden');
                document.getElementById('pwInput').value = '';
                document.getElementById('pwInput').focus();
            }
        }

        // Allow 'Enter' key for login
        document.getElementById('pwInput')?.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        function showSection(id) {
            // ... existing showSection code ...
        }
        // ... rest of the existing code ...
    </script>
</body>
</html>
